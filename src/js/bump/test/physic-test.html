<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste Physic (Ammo.js)</title>
</head>
<body>
  <h1>Teste Physic (Ammo.js)</h1>
  <pre id="output"></pre>
  <div id="threejs-canvas"></div>
  <script type="module">
  import { Scene } from '../../threejs/scene/Scene.js';
  import { PerspectiveCamera } from '../../threejs/PerspectiveCamera.js';
  import { WebGLRenderer } from '../../threejs/render/WebGLRenderer.js';
  import * as THREE from 'three';
  import Physic from '../physical-core.js';

  // Cria cena
  const scene = new Scene();
  scene.setBackgroundColor(0x222244);

  // Cria câmera
  const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.setposition(0, 5, 15);

  // Cria renderizador
  const renderer = new WebGLRenderer(true, true);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.appendTo('threejs-canvas');

  // Luz
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5, 10, 7);
  scene.addToScene(light);

  // Instancia física e cria cubos
  let physic;
  (async () => {
    physic = await new Physic().create();

    // Cubo fixo (chão)
    const groundGeo = new THREE.BoxGeometry(8, 1, 8);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.set(0, -1, 0);
    scene.addToScene(ground);
    const groundShape = physic.createShape(4, 0.5, 4); // metade das dimensões
    physic.createRigidBody(ground, groundShape, 0); // massa 0 = imóvel

    // Cubo dinâmico
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const box = new THREE.Mesh(boxGeo, boxMat);
    box.position.set(0, 4, 0);
    scene.addToScene(box);
    const boxShape = physic.createShape(0.5, 0.5, 0.5);
    physic.createRigidBody(box, boxShape, 1); // massa 1 = dinâmico


        // Cubo dinâmico
    const boxGeo2 = new THREE.BoxGeometry(1, 1, 1);
    const boxMat2 = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const box2 = new THREE.Mesh(boxGeo2, boxMat2);
    box2.position.set(0, 1, 0);
    scene.addToScene(box2);
    const boxShape2 = physic.createShape(0.5, 0.5, 0.5);
      const ghost =   physic.createGhost(box2, boxShape2);
      ghost.mesh = box2;


    // Loop de animação
    let last = performance.now();
function animate() {
  const now = performance.now();
  const delta = (now - last) / 1000;
  last = now;

  // 1️⃣ atualiza transform do ghost
  physic.updateGhostTransform(ghost, ghost.mesh);

  // 2️⃣ avança a simulação
  physic.update(delta);

  // 3️⃣ checa overlap (AGORA FUNCIONA)
  physic.checkGhostCollisions(ghost);

  renderer.render(scene.get(), camera.get());
  requestAnimationFrame(animate);
}

    animate();
  })();
  </script>
</body>
</html>
