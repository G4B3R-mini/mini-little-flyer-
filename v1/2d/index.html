	<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>meu primeiro jogo</title>
</head>
<style>
body {
display: flex;
flex-direction: column;
align-items: center;
font-family: Arial, sans-serif;
}

canvas {
border: 10px solid #ccc;
image-rendering: pixelated;
image-rendering: crisp-edges;
image-rendering: -webkit-crisp-edges;
width: 400px;
height: 400px;
margin-bottom: 20px;
}

.controls {
display: grid;
grid-template-areas:
". up ."
"left . right"
". down .";
grid-gap: 10px;
}

.control-btn {
width: 60px;
height: 60px;
border-radius: 50%;
border: none;
background-color: #4a90e2;
color: white;
font-size: 24px;
cursor: pointer;
display: flex;
justify-content: center;
align-items: center;
transition: background-color 0.2s;
}

.control-btn:hover {
background-color: #357ac0;
}

.control-btn:active {
background-color: #2a5d8f;
transform: scale(0.95);
}

#up-btn {
grid-area: up;
}

#left-btn {
grid-area: left;
}

#right-btn {
grid-area: right;
}

#down-btn {
grid-area: down;
}
</style>
</head>
<body>
<canvas id="screen" width="10" height="10"></canvas>

<div class="controls">
<button id="up-btn" class="control-btn">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 19V5M12 5l7 7M12 5l-7 7" />
</svg>
</button>

<button id="left-btn" class="control-btn">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M19 12H5M5 12l7 7M5 12l7-7" />
</svg>
</button>

<button id="right-btn" class="control-btn">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M5 12h14M19 12l-7 7M19 12l-7-7" />
</svg>
</button>

<button id="down-btn" class="control-btn">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 5v14M12 19l7-7M12 19l-7-7" />
</svg>
</button>
</div>
<script type="module" src="./main.js"></script>
<script type="module">

import {Renderer, Scene} from './Ui/Renderer.js';
import { Player } from './Player.js';
import {Listner} from "./Listener.js"
const scene =new Scene()
const renderer =new Renderer(document.getElementById("screen"),scene )
const player1 = new Player ()
scene.add('player1', player1)



const listner =new Listner(document)
animation()
function animation() {
	
	renderer.render()
	


requestAnimationFrame(animation)
}

</script>
</body>
</html>
